<html>
<head>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: block;
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/havaianasdestruido/.github/refs/heads/main/cat.jpg">
  <script language="JavaScript"> 
var space = " ";
var speed = 60;
var pos = 0;

var messages = [
    "QUACK!! oops, i mean: meow! w-well, actually :nerd: it would be MEACK since my pfp is a cat but my name is PatoFlamejanteTV, so its.. both?!",
    "UltimateQuack, now on the Internet!!",
    "hi hi hi hi hi hi hi hi hi hi hi hi hi hi hih ih ih ihi hih ih ... ... ... does anyone really read this?",
    "QUACK QUACK QUACK!!",
    "asdfghjkl",
    "meow :3",
    "Certified Duck Moment™",
    "fun fact: this website is open-source!"
];

// Shuffle messages
function shuffle(array)
{
    for (var i = array.length - 1; i > 0; i--)
    {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = array[i];
        array[i] = array[j];
        array[j] = temp;
    }
}

var queue = messages.slice();
shuffle(queue);

var msg = queue.shift();

function Scroll()
{
    document.title = msg.substring(pos, msg.length) + space + msg.substring(0, pos);

    pos++;

    if (pos > msg.length)
    {
        pos = 0;

        // Get the next message
        if (queue.length === 0)
        {
            // All messages were shown — create a new random order
            queue = messages.slice();
            shuffle(queue);
        }

        msg = queue.shift();
    }

    window.setTimeout(Scroll, speed);
}

Scroll();
</script>
  <script>
    (() => {
    const konamiCode = [
        "ArrowUp",
        "ArrowUp",
        "ArrowDown",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "ArrowLeft",
        "ArrowRight",
        "b",
        "a"
    ];

    let input = [];

    window.addEventListener("keydown", (event) => {
        const key = event.key.length === 1
            ? event.key.toLowerCase()
            : event.key;

        // Add the key to the sequence
        input.push(key);

        // Only keep the last 10 keys
        if (input.length > konamiCode.length) {
            input.shift();
        }

        // Konami code entered
        if (input.length === konamiCode.length &&
            input.every((key, i) => key === konamiCode[i])) {

            console.log("Konami code armed! Press Enter...");
            window.__konamiArmed = true;
        }

        // Enter activates it
        if (event.key === "Enter" && window.__konamiArmed) {
            window.__konamiArmed = false;
            activateKonami();
        }
    });

    function activateKonami() {
        // Try to turn the window into a popup-sized window.
        // This only works if the browser allows window resizing.
        const width = 600;
        const height = 400;

        try {
            window.resizeTo(width, height);
            window.moveTo(
                (screen.availWidth - width) / 2,
                (screen.availHeight - height) / 2
            );
        } catch (e) {
            console.warn("Browser blocked window resizing.");
        }

        // Shake animation
        const originalX = window.screenX;
        const originalY = window.screenY;

        let shakes = 0;
        const maxShakes = 20;

        const shake = () => {
            if (shakes >= maxShakes) {
                try {
                    window.moveTo(originalX, originalY);
                } catch {}
                return;
            }

            const intensity = 12;

            try {
                window.moveTo(
                    originalX + (Math.random() * intensity * 2 - intensity),
                    originalY + (Math.random() * intensity * 2 - intensity)
                );
            } catch {}

            shakes++;
            setTimeout(shake, 40);
        };

        shake();
    }
})();
  </script>
</body>
</html>
