
# Deploy static content to GitHub Pages with dynamic GitHub stats
name: Deploy static content to Pages

on:
  push:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Update GitHub statistics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PROFILE="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/users/havaianasdestruido)"

          PUBLIC_REPOS="$(jq -er '.public_repos' <<< "$PROFILE")"
          FOLLOWERS="$(jq -er '.followers' <<< "$PROFILE")"

          echo "Public repositories: $PUBLIC_REPOS"
          echo "Followers: $FOLLOWERS"

          sed -i \
            -e "s|__PUBLIC_REPOS__|$PUBLIC_REPOS|g" \
            -e "s|__FOLLOWERS__|$FOLLOWERS|g" \
            index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
